name: Build debug APK

on:
  push:
    branches: [master, unify-notes-canvas]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The app builds a native library (tree-sitter), so the pinned NDK and CMake are required.
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" && break
            echo "sdkmanager attempt $attempt failed"; sleep 10
            [ $attempt -eq 3 ] && exit 1
          done

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee test.log

      # Surface failing tests as annotations.
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          [ -f test.log ] && grep -E "FAILED|^e: |Test.*>" test.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      # Surface Kotlin compile errors as annotations, so they can be read without the raw log.
      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] && grep -E "^e: " build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: xnotes-bench-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
